<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name or "Vignan AI Classroom" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🏫 <span>Vignan's</span> AI Classroom</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/analytics">Analytics</a>
      <span class="live-dot">● SYSTEM</span>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>Vignan's Foundation for Science, Technology & Research · AI Powered Smart Campus Analytics</footer>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
