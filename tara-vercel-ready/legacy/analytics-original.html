<!DOCTYPE html>
<html>

<head>

<title>
Vignan AI Analytics Dashboard
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial;
}


body{

background:
linear-gradient(
135deg,
#020617,
#0f172a
);

color:white;
padding:20px;

}



/* HEADER */

header{

background:#1e293b;

padding:20px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 0 25px black;

}


header h1{

color:#38bdf8;

}


.status{

background:#052e16;

color:#22c55e;

padding:10px 20px;

border-radius:30px;

}




/* CARDS */


.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-top:25px;

}



.card{

background:
rgba(30,41,59,.9);

padding:25px;

border-radius:20px;

text-align:center;

transition:.3s;

}



.card:hover{

transform:translateY(-8px);

box-shadow:0 0 25px #2563eb;

}



.card h2{

font-size:40px;

color:#22c55e;

}





/* ANALYTICS */


.dashboard{

display:grid;

grid-template-columns:2fr 1fr;

gap:20px;

margin-top:25px;

}



.panel{

background:#1e293b;

padding:25px;

border-radius:25px;

box-shadow:0 0 20px black;

}



.panel h2{

color:#38bdf8;

margin-bottom:15px;

}




/* TABLE */


table{

width:100%;

border-collapse:collapse;

}


th{

background:#020617;

color:#38bdf8;

padding:12px;

}


td{

padding:10px;

text-align:center;

border-bottom:1px solid #334155;

}





.online{

color:#22c55e;

}





canvas{

background:#020617;

border-radius:20px;

padding:10px;

}




footer{

margin-top:25px;

text-align:center;

color:#94a3b8;

}



</style>

</head>



<body>




<header>


<h1>

🏫 Vignan's Students Strength Dashboard

</h1>


<div class="status">

🟢 AI System Online

</div>


</header>





<section class="cards">


<div class="card">

<h3>Total Classes</h3>

<h2>25</h2>

</div>



<div class="card">

<h3>Total Students</h3>

<h2>750</h2>

</div>



<div class="card">

<h3>Attendance</h3>

<h2>92%</h2>

</div>



<div class="card">

<h3>AI Cameras</h3>

<h2>25</h2>

</div>


</section>







<section class="dashboard">


<div class="panel">


<h2>
📚 Class Wise Student Strength
</h2>


<table>


<tr>

<th>Class</th>

<th>Students</th>

<th>Faculty</th>

<th>Status</th>

</tr>



<script>


let students=[];


for(let i=1;i<=25;i++)

{


let count=Math.floor(
Math.random()*25
)+55;


students.push(count);


document.write(`

<tr>

<td>A${100+i}</td>

<td>${count}</td>

<td>Present</td>

<td class="online">
Online
</td>

</tr>

`);


}


</script>


</table>


</div>

</section>

</script>





<footer>

🏢 Vignan's Foundation for Science Technology & Research

<br>

AI Powered Smart Campus Analytics System

</footer>



</body>

</html>
